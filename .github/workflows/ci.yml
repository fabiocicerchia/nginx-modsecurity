name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Lint and secret scanning live in code-quality.yml and security.yml.
# This workflow runs the tests — without it nothing here proves they pass.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # versions.json is the single source of truth for what is supported. Read
  # here rather than duplicated into the matrix, so adding a version is one
  # edit and cannot drift from what the Dockerfile verifies.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: read
        run: echo "versions=$(jq -c '.supported' versions.json)" >> "$GITHUB_OUTPUT"

  test:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      # Every supported version against both libcs, and one failing does not
      # hide the others: a module that loads on 1.27 and not on 1.26, or on
      # glibc and not musl, is precisely the bug this matrix exists to catch.
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.matrix.outputs.versions) }}
        flavour: [bookworm, alpine]
    name: test (nginx ${{ matrix.version.nginx }} ${{ matrix.flavour }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build image and run smoke tests
        # BASE is left to the Makefile, which builds it from the version, the
        # libc and the matching digest in versions.json — so what CI tests is
        # one specific base image, not whatever the tag points at today.
        env:
          NGINX_VERSION: ${{ matrix.version.nginx }}
          NGINX_SHA256: ${{ matrix.version.sha256 }}
          FLAVOUR: ${{ matrix.flavour }}
        run: |
          make test \
            NGINX_VERSION="$NGINX_VERSION" \
            NGINX_SHA256="$NGINX_SHA256" \
            FLAVOUR="$FLAVOUR"

      # test.sh uses one hand-written rule on purpose, so it tests the module
      # rather than the CRS being present. That leaves the rule set every
      # consumer actually loads unverified — far larger, and using anomaly
      # scoring, transformations and libinjection operators that one `@streq`
      # never touches. This asserts per attack class that a known-bad request
      # is refused AND that ordinary ones are not: a WAF that blocks everything
      # is as broken as one that blocks nothing, and only the second half
      # catches it. The image reuses the build from the step above.
      - name: Load the OWASP CRS and prove it blocks
        env:
          NGINX_VERSION: ${{ matrix.version.nginx }}
          NGINX_SHA256: ${{ matrix.version.sha256 }}
          FLAVOUR: ${{ matrix.flavour }}
        run: |
          make test-crs \
            NGINX_VERSION="$NGINX_VERSION" \
            NGINX_SHA256="$NGINX_SHA256" \
            FLAVOUR="$FLAVOUR"

  # Size and clean build time, on the default version only: the numbers are the
  # same shape across the matrix, and a --no-cache build per cell would be six
  # of them for one answer. Written to the job summary rather than a file in
  # git, so the record is attached to the inputs that produced it instead of
  # becoming a stale number that reads like a current one.
  report:
    needs: matrix
    runs-on: ubuntu-latest
    name: build report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Measure build time and image size
        run: |
          v="$(jq -c '.supported[] | select(.default)' versions.json)"
          make report \
            NGINX_VERSION="$(echo "$v" | jq -r .nginx)" \
            NGINX_SHA256="$(echo "$v" | jq -r .sha256)"
