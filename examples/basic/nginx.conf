# load_module must be at the top level, above `events`. Inside `http` it is a
# syntax error, which is the third-most-common way to get this wrong.
load_module /usr/lib/nginx/modules/ngx_http_modsecurity_module.so;

# Runs as the nginx user, so everything it writes lives in /tmp.
pid /tmp/nginx.pid;

events {}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity/modsecurity.conf;

    server {
        listen 8080;

        # `modsecurity` is also settable per server and per location, which is
        # how a rollout should start: one path first, not the whole site.
        # A real file, not `return 200`: `return` answers in the rewrite
        # phase, before ModSecurity's phase-2 handler, so the demo rule and
        # every CRS rule would load and never run.
        location / {
            root /usr/share/nginx/html;
        }

        location /unprotected/ {
            modsecurity off;
            return 200 "ok, no waf\n";
            default_type text/plain;
        }
    }
}
